<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Coffee Ratio</title>
    <style>
        :root {
            --c-coffee: #F29E8E; /* Peach */
            --c-water: #9AD9EA;  /* Light Blue */
            --c-ratio: #EEEEEE;  /* Light Grey */
            --c-saved: #444444;  /* Dark Grey */
            --text-dark: #333333;
            --text-light: #FFFFFF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            overflow: hidden; 
            background-color: #fff;
        }

        /* --- SECTIONS --- */
        .quadrant {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }

        #q-saved { background-color: var(--c-saved); color: var(--text-light); overflow: hidden; justify-content: flex-start; padding-top: 40px;}
        #q-coffee { background-color: var(--c-coffee); color: var(--text-dark); }
        #q-ratio { background-color: var(--c-ratio); color: var(--text-dark); }
        #q-water { background-color: var(--c-water); color: var(--text-dark); }

        /* --- LABELS & TYPOGRAPHY --- */
        .label {
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 900; /* Extra Bold */
            font-size: 1.1rem; /* Larger */
            pointer-events: none; 
        }

        /* The horizontal line under the label */
        .label-line {
            width: 60px; /* Fixed short width */
            height: 3px;
            background-color: currentColor;
            margin-bottom: 15px;
            pointer-events: none;
        }

        /* Container for the number to handle swapping between Text and Input */
        .number-container {
            position: relative;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: text;
        }

        /* The Stylized Display (Big Int, Small Decimal) */
        .value-display-styled {
            font-size: 3.2rem; /* Slightly smaller to fit circle */
            font-weight: bold;
            text-align: center;
            font-family: inherit;
            line-height: 1;
            pointer-events: auto; /* Allow clicking to edit */
        }

        .decimal-part {
            font-size: 0.5em; /* 50% size */
            vertical-align: baseline;
            margin-left: -2px;
        }

        /* The Input (Hidden by default, shown when editing) */
        .value-input {
            font-size: 2.5rem;
            font-weight: bold;
            background: rgba(255,255,255,0.8);
            border: none;
            text-align: center;
            width: 140px;
            color: #000;
            font-family: inherit;
            margin: 0;
            padding: 0;
            position: absolute;
            display: none; /* Hidden */
            border-radius: 4px;
        }
        
        /* Remove input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .unit {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.6;
            font-weight: bold;
            pointer-events: none;
        }

        .sub-unit {
            font-size: 1.0rem;
            font-weight: bold;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* --- DIAL UI --- */
        .dial-container {
            position: absolute;
            width: 85%;
            height: 85%;
            max-width: 260px;
            max-height: 260px;
            border-radius: 50%;
            /* SOLID LINE */
            border: 3px solid rgba(0,0,0,0.08); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none; 
        }

        .dial-content {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* Pass touches to dial */
        }
        
        /* Re-enable pointer events for the number so we can tap to type */
        .number-container {
            pointer-events: auto;
        }

        /* --- SAVED LIST STYLES --- */
        .saved-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin-bottom: 20px;
        }
        
        .btn-save {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 12px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .saved-list {
            width: 100%;
            overflow-y: auto;
            flex-grow: 1;
            padding: 0 15px;
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .saved-list::-webkit-scrollbar { display: none; }

        .saved-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.15);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .delete-x {
            color: #ff8e8e;
            margin-left: 12px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0 5px;
        }

    </style>
</head>
<body>

    <div class="quadrant" id="q-saved">
        <div class="saved-header">
            <span style="font-weight:900; border-bottom: 2px solid #fff; letter-spacing:1px;">SAVED</span>
            <button class="btn-save" onclick="saveCurrent()">SAVE (+)</button>
        </div>
        <div class="saved-list" id="savedList">
            </div>
    </div>

    <div class="quadrant" id="q-coffee">
        <div class="dial-container" id="dial-coffee">
            <div class="dial-content">
                <div class="label">COFFEE</div>
                <div class="label-line"></div>
                
                <div class="number-container" onclick="editMode('coffee')">
                    <div id="disp-coffee" class="value-display-styled">
                        20<span class="decimal-part">.0</span>
                    </div>
                    <input type="number" id="in-coffee" class="value-input" step="0.1" onblur="viewMode('coffee')">
                </div>

                <div class="unit">grams</div>
            </div>
        </div>
    </div>

    <div class="quadrant" id="q-ratio">
        <div class="dial-container" id="dial-ratio">
            <div class="dial-content">
                <div class="label">RATIO</div>
                <div class="label-line"></div>

                <div class="number-container" onclick="editMode('ratio')">
                    <span style="font-size: 2rem; font-weight:bold; margin-right:5px; opacity:0.8;">1:</span>
                    <div id="disp-ratio" class="value-display-styled">
                        16<span class="decimal-part">.0</span>
                    </div>
                    <input type="number" id="in-ratio" class="value-input" step="0.1" onblur="viewMode('ratio')">
                </div>
            </div>
        </div>
    </div>

    <div class="quadrant" id="q-water">
        <div class="dial-container" id="dial-water">
            <div class="dial-content">
                <div class="label">WATER</div>
                <div class="label-line"></div>

                <div class="number-container" onclick="editMode('water')">
                    <div id="disp-water" class="value-display-styled">
                        320<span class="decimal-part">.0</span>
                    </div>
                    <input type="number" id="in-water" class="value-input" step="0.1" onblur="viewMode('water')">
                </div>

                <div class="unit">grams</div>
                <div class="sub-unit" id="text-oz">11.3 fl oz</div>
            </div>
        </div>
    </div>

<script>
    // --- STATE MANAGEMENT ---
    const state = {
        coffee: 20.0,
        ratio: 16.0,
        water: 320.0
    };

    const savedBrews = JSON.parse(localStorage.getItem('coffeeAppSaved')) || [];

    // --- DOM REFERENCES ---
    const inputs = {
        coffee: document.getElementById('in-coffee'),
        ratio: document.getElementById('in-ratio'),
        water: document.getElementById('in-water')
    };
    const displays = {
        coffee: document.getElementById('disp-coffee'),
        ratio: document.getElementById('disp-ratio'),
        water: document.getElementById('disp-water'),
        oz: document.getElementById('text-oz')
    };
    const savedListEl = document.getElementById('savedList');

    // --- INITIALIZATION ---
    function init() {
        updateUI();
        renderSavedList();
        
        // Setup Dials with specific sensitivities
        // 3.0 units per rotation for Coffee/Ratio
        // 40.0 units per rotation for Water (Faster!)
        setupDial('dial-coffee', 3.0, (delta) => {
            state.coffee = Math.max(0, state.coffee + delta);
            updateWater();
        });
        
        setupDial('dial-ratio', 3.0, (delta) => {
            state.ratio = Math.max(1, state.ratio + delta);
            updateCoffee();
        });
        
        setupDial('dial-water', 40.0, (delta) => {
            state.water = Math.max(0, state.water + delta);
            updateCoffee();
        });

        // Add Enter Key listener to close inputs
        Object.values(inputs).forEach(input => {
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') input.blur();
            });
        });
    }

    // --- INPUT MODES (EDIT vs VIEW) ---
    function editMode(type) {
        const input = inputs[type];
        const display = displays[type];
        
        // Populate input with current raw value
        input.value = state[type].toFixed(1);
        
        // Show input, hide display
        input.style.display = 'block';
        display.style.visibility = 'hidden';
        
        input.focus();
    }

    function viewMode(type) {
        const input = inputs[type];
        const display = displays[type];
        
        // Save new value
        let val = parseFloat(input.value);
        if(!isNaN(val)) {
            state[type] = val;
            // Trigger logic based on what changed
            if(type === 'coffee') updateWater();
            else if(type === 'water') updateCoffee();
            else if(type === 'ratio') updateCoffee();
        }

        // Hide input, show display
        input.style.display = 'none';
        display.style.visibility = 'visible';
        
        updateUI(); // Refresh all styled numbers
    }


    // --- CALCULATION LOGIC ---
    function updateWater() {
        state.water = Math.round((state.coffee * state.ratio) * 10) / 10;
        updateUI();
    }

    function updateCoffee() {
        if(state.ratio === 0) return;
        state.coffee = Math.round((state.water / state.ratio) * 10) / 10;
        updateUI();
    }

    // Helper to generate the "Small Decimal" HTML
    function formatNumberHtml(num) {
        const str = num.toFixed(1);
        const parts = str.split('.');
        return `${parts[0]}<span class="decimal-part">.${parts[1]}</span>`;
    }

    function updateUI() {
        // Update Styled Displays
        displays.coffee.innerHTML = formatNumberHtml(state.coffee);
        displays.ratio.innerHTML = formatNumberHtml(state.ratio);
        displays.water.innerHTML = formatNumberHtml(state.water);

        // Update Oz Display
        const oz = (state.water * 0.035274).toFixed(1);
        displays.oz.textContent = `${oz} fl oz`;
    }

    // --- DIAL LOGIC ---
    function setupDial(elementId, unitsPerRotation, callback) {
        const el = document.getElementById(elementId);
        let lastAngle = 0;
        let isDragging = false;
        
        const UNITS_PER_DEGREE = unitsPerRotation / 360; 

        function getAngle(touchX, touchY, center) {
            const y = touchY - center.y;
            const x = touchX - center.x;
            return Math.atan2(y, x) * 180 / Math.PI;
        }

        function start(e) {
            // Don't activate dial if touching the input box
            if(e.target.tagName === 'INPUT') return;
            
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = el.getBoundingClientRect();
            
            // Center is relative to viewport
            el.dataset.centerX = rect.left + rect.width / 2;
            el.dataset.centerY = rect.top + rect.height / 2;
            
            lastAngle = getAngle(touch.clientX, touch.clientY, {
                x: parseFloat(el.dataset.centerX),
                y: parseFloat(el.dataset.centerY)
            });
            e.preventDefault(); 
        }

        function move(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const touch = e.touches ? e.touches[0] : e;
            const center = {
                x: parseFloat(el.dataset.centerX),
                y: parseFloat(el.dataset.centerY)
            };

            const currentAngle = getAngle(touch.clientX, touch.clientY, center);
            let deltaAngle = currentAngle - lastAngle;

            // Handle wrap around
            if (deltaAngle > 180) deltaAngle -= 360;
            if (deltaAngle < -180) deltaAngle += 360;

            let valueChange = deltaAngle * UNITS_PER_DEGREE;
            
            // Only fire callback if we have meaningful change to prevent jitter
            if (Math.abs(valueChange) > 0) {
                callback(valueChange);
                lastAngle = currentAngle;
            }
        }

        function end() { isDragging = false; }

        el.addEventListener('touchstart', start, {passive: false});
        el.addEventListener('touchmove', move, {passive: false});
        el.addEventListener('touchend', end);
        el.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
    }

    // --- SAVED LIST LOGIC ---
    function saveCurrent() {
        if(savedBrews.length >= 10) {
            alert("List full! Remove one to save.");
            return;
        }
        
        // Calculate Oz for the saved record
        const oz = (state.water * 0.035274).toFixed(1);

        const entry = {
            id: Date.now(),
            coffee: state.coffee.toFixed(1),
            ratio: state.ratio.toFixed(1),
            water: state.water.toFixed(0),
            oz: oz
        };
        
        savedBrews.unshift(entry); 
        localStorage.setItem('coffeeAppSaved', JSON.stringify(savedBrews));
        renderSavedList();
    }

    function deleteItem(id) {
        const index = savedBrews.findIndex(i => i.id === id);
        if (index > -1) {
            savedBrews.splice(index, 1);
            localStorage.setItem('coffeeAppSaved', JSON.stringify(savedBrews));
            renderSavedList();
        }
    }
    
    function loadItem(id) {
        const item = savedBrews.find(i => i.id === id);
        if(item) {
            state.coffee = parseFloat(item.coffee);
            state.ratio = parseFloat(item.ratio);
            state.water = parseFloat(item.water);
            updateUI(); 
        }
    }

    function renderSavedList() {
        savedListEl.innerHTML = '';
        savedBrews.forEach(item => {
            const div = document.createElement('div');
            div.className = 'saved-item';
            div.innerHTML = `
                <div onclick="loadItem(${item.id})" style="flex-grow:1; cursor:pointer;">
                    <strong>${item.coffee}g</strong> @ 1:${item.ratio} <br>
                    <span style="opacity:0.7">-> ${item.water}g (${item.oz} oz)</span>
                </div>
                <div class="delete-x" onclick="deleteItem(${item.id})">✕</div>
            `;
            savedListEl.appendChild(div);
        });
    }

    init();

</script>
</body>
</html>
