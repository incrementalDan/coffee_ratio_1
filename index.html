<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Coffee Dial</title>
    <style>
        :root {
            --c-coffee: #F29E8E; /* Peach */
            --c-water: #9AD9EA;  /* Light Blue */
            --c-ratio: #EEEEEE;  /* Light Grey */
            --c-saved: #444444;  /* Dark Grey */
            --text-dark: #333333;
            --text-light: #FFFFFF;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            overflow: hidden; /* Prevent body scroll */
            background-color: #fff;
        }

        /* --- SECTIONS --- */
        .quadrant {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px;
        }

        #q-saved { background-color: var(--c-saved); color: var(--text-light); overflow: hidden; justify-content: flex-start; padding-top: 30px;}
        #q-coffee { background-color: var(--c-coffee); color: var(--text-dark); }
        #q-ratio { background-color: var(--c-ratio); color: var(--text-dark); }
        #q-water { background-color: var(--c-water); color: var(--text-dark); }

        /* --- LABELS & TYPOGRAPHY --- */
        .label {
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid currentColor;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            pointer-events: none; /* Let touches pass through to dial */
        }

        .value-display {
            font-size: 3.5rem;
            font-weight: bold;
            background: transparent;
            border: none;
            text-align: center;
            width: 100%;
            color: inherit;
            font-family: inherit;
            margin: 0;
            padding: 0;
        }
        
        /* Remove input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .unit {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.8;
            pointer-events: none;
        }

        .sub-unit {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }

        /* --- DIAL UI --- */
        /* This is the invisible touch area for the dial */
        .dial-container {
            position: absolute;
            width: 85%;
            height: 85%;
            max-width: 250px;
            max-height: 250px;
            border-radius: 50%;
            /* Optional: Visual guide for the wheel */
            border: 4px dashed rgba(0,0,0,0.1); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none; /* Critical for handling custom touch logic */
        }

        /* Make inputs sit on top of the dial but allow touches on the rim */
        .dial-content {
            z-index: 10;
            text-align: center;
            pointer-events: none; /* Let clicks pass to the dial container by default */
        }
        
        /* Re-enable pointer events just for the input so we can tap to type */
        .dial-content input {
            pointer-events: auto;
        }

        /* --- SAVED LIST STYLES --- */
        .saved-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin-bottom: 15px;
        }
        
        .btn-save {
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 10px;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .saved-list {
            width: 100%;
            overflow-y: auto;
            flex-grow: 1;
            padding: 0 10px;
            /* Hide scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .saved-list::-webkit-scrollbar { display: none; }

        .saved-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .delete-x {
            color: #ff6b6b;
            margin-left: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="quadrant" id="q-saved">
        <div class="saved-header">
            <span style="font-weight:bold; border-bottom: 1px solid #fff;">SAVED</span>
            <button class="btn-save" onclick="saveCurrent()">SAVE (+)</button>
        </div>
        <div class="saved-list" id="savedList">
            </div>
    </div>

    <div class="quadrant" id="q-coffee">
        <div class="dial-container" id="dial-coffee">
            <div class="dial-content">
                <div class="label">COFFEE</div>
                <input type="number" id="in-coffee" class="value-display" value="20.0" step="0.1">
                <div class="unit">grams</div>
            </div>
        </div>
    </div>

    <div class="quadrant" id="q-ratio">
        <div class="dial-container" id="dial-ratio">
            <div class="dial-content">
                <div class="label">RATIO</div>
                <div style="display:flex; align-items:center; justify-content:center;">
                    <span class="value-display" style="width:auto; font-size: 2.5rem;">1:</span>
                    <input type="number" id="in-ratio" class="value-display" style="width:120px; text-align:left;" value="16.0" step="0.1">
                </div>
            </div>
        </div>
    </div>

    <div class="quadrant" id="q-water">
        <div class="dial-container" id="dial-water">
            <div class="dial-content">
                <div class="label">WATER</div>
                <input type="number" id="in-water" class="value-display" value="320.0" step="0.1">
                <div class="unit">grams</div>
                <div class="sub-unit" id="disp-oz">11.3 oz</div>
            </div>
        </div>
    </div>

<script>
    // --- STATE MANAGEMENT ---
    const state = {
        coffee: 20.0,
        ratio: 16.0,
        water: 320.0
    };

    const savedBrews = JSON.parse(localStorage.getItem('coffeeAppSaved')) || [];

    // --- DOM ELEMENTS ---
    const els = {
        coffee: document.getElementById('in-coffee'),
        ratio: document.getElementById('in-ratio'),
        water: document.getElementById('in-water'),
        oz: document.getElementById('disp-oz'),
        savedList: document.getElementById('savedList')
    };

    // --- INITIALIZATION ---
    function init() {
        updateUI();
        renderSavedList();
        setupDial('dial-coffee', 'coffee', handleCoffeeChange);
        setupDial('dial-ratio', 'ratio', handleRatioChange);
        setupDial('dial-water', 'water', handleWaterChange);
        
        // Manual Input Listeners
        els.coffee.addEventListener('change', (e) => {
            state.coffee = parseFloat(e.target.value);
            updateWater(); 
        });
        els.ratio.addEventListener('change', (e) => {
            state.ratio = parseFloat(e.target.value);
            updateCoffee(); // Option B logic
        });
        els.water.addEventListener('change', (e) => {
            state.water = parseFloat(e.target.value);
            updateCoffee();
        });
    }

    // --- CALCULATION LOGIC ---
    
    // Change Coffee -> Update Water
    function updateWater() {
        state.water = Math.round((state.coffee * state.ratio) * 10) / 10;
        updateUI();
    }

    // Change Water -> Update Coffee
    function updateCoffee() {
        if(state.ratio === 0) return;
        state.coffee = Math.round((state.water / state.ratio) * 10) / 10;
        updateUI();
    }

    // Change Ratio -> Update Coffee (Option B Logic)
    // "I want to keep my water amount fixed, but change the ratio, so tell me new coffee amount"
    // Coffee = Water / Ratio
    function handleRatioLogic() {
        updateCoffee();
    }

    function updateUI() {
        // Update Inputs if they aren't currently focused (to prevent fighting the user while typing)
        if(document.activeElement !== els.coffee) els.coffee.value = state.coffee.toFixed(1);
        if(document.activeElement !== els.ratio) els.ratio.value = state.ratio.toFixed(1);
        if(document.activeElement !== els.water) els.water.value = state.water.toFixed(1);

        // Update Oz Display
        const oz = (state.water * 0.035274).toFixed(1);
        els.oz.textContent = `${oz} fl oz`;
    }

    // --- DIAL HANDLERS ---
    
    function handleCoffeeChange(delta) {
        state.coffee = Math.max(0, state.coffee + delta);
        updateWater();
    }

    function handleWaterChange(delta) {
        state.water = Math.max(0, state.water + delta);
        updateCoffee();
    }

    function handleRatioChange(delta) {
        state.ratio = Math.max(1, state.ratio + delta);
        handleRatioLogic(); // Updates coffee
    }


    // --- JOG DIAL LOGIC (The iPod Wheel) ---
    function setupDial(elementId, paramName, callback) {
        const el = document.getElementById(elementId);
        let startAngle = 0;
        let lastAngle = 0;
        let isDragging = false;
        
        // Sensitivity: User wants 1 rotation = 3.0 change.
        // 1 rotation = 360 degrees (or 2PI radians).
        // 360 deg = 3.0 units.
        // 1 deg = 3.0 / 360 = 0.00833 units.
        const UNITS_PER_DEGREE = 3.0 / 360; 

        function getAngle(touchX, touchY, center) {
            const y = touchY - center.y;
            const x = touchX - center.x;
            // atan2 returns -PI to PI. Convert to degrees 0-360
            let deg = Math.atan2(y, x) * 180 / Math.PI;
            return deg;
        }

        function start(e) {
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = el.getBoundingClientRect();
            const center = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            
            // Store center for move events
            el.dataset.centerX = center.x;
            el.dataset.centerY = center.y;
            
            lastAngle = getAngle(touch.clientX, touch.clientY, center);
            e.preventDefault(); // Stop scrolling while using dial
        }

        function move(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const touch = e.touches ? e.touches[0] : e;
            const center = {
                x: parseFloat(el.dataset.centerX),
                y: parseFloat(el.dataset.centerY)
            };

            const currentAngle = getAngle(touch.clientX, touch.clientY, center);
            let deltaAngle = currentAngle - lastAngle;

            // Handle wrap around (crossing from 180 to -180 or vice versa)
            if (deltaAngle > 180) deltaAngle -= 360;
            if (deltaAngle < -180) deltaAngle += 360;

            // Calculate value change
            let valueChange = deltaAngle * UNITS_PER_DEGREE;
            
            // Round to nearest 0.1 to avoid floating point drift
            // But we accumulate raw to allow smooth slow dragging
            
            // Actually, simply passing the raw delta to the handler works best,
            // the handler adds it to state, and we round the State for display only.
            // However, to stick to 0.1 increments strictly:
            
            if (Math.abs(valueChange) >= 0.1) {
                // If we moved enough to trigger a 0.1 change
                // (This makes it 'clicky' rather than smooth float)
                // Let's just pass the raw float and round in the display for smoothness
                callback(valueChange);
                lastAngle = currentAngle;
            }
            
            // For now, let's just update continuously for smoothness
            callback(valueChange);
            lastAngle = currentAngle;
        }

        function end() {
            isDragging = false;
        }

        // Touch Events
        el.addEventListener('touchstart', start, {passive: false});
        el.addEventListener('touchmove', move, {passive: false});
        el.addEventListener('touchend', end);
        
        // Mouse Events (for desktop testing)
        el.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
    }


    // --- SAVED LIST LOGIC ---
    function saveCurrent() {
        if(savedBrews.length >= 10) {
            alert("List full! Remove one to save.");
            return;
        }
        
        const entry = {
            id: Date.now(),
            coffee: state.coffee.toFixed(1),
            ratio: state.ratio.toFixed(1),
            water: state.water.toFixed(0) // Integers look cleaner for lists
        };
        
        savedBrews.unshift(entry); // Add to top
        localStorage.setItem('coffeeAppSaved', JSON.stringify(savedBrews));
        renderSavedList();
    }

    function deleteItem(id) {
        const index = savedBrews.findIndex(i => i.id === id);
        if (index > -1) {
            savedBrews.splice(index, 1);
            localStorage.setItem('coffeeAppSaved', JSON.stringify(savedBrews));
            renderSavedList();
        }
    }
    
    function loadItem(id) {
        const item = savedBrews.find(i => i.id === id);
        if(item) {
            state.coffee = parseFloat(item.coffee);
            state.ratio = parseFloat(item.ratio);
            state.water = parseFloat(item.water); // Will recalculate slightly based on ratio logic
            updateUI(); // Just load raw values
        }
    }

    function renderSavedList() {
        els.savedList.innerHTML = '';
        savedBrews.forEach(item => {
            const div = document.createElement('div');
            div.className = 'saved-item';
            div.innerHTML = `
                <div onclick="loadItem(${item.id})" style="flex-grow:1; cursor:pointer;">
                    <strong>${item.coffee}g</strong> @ 1:${item.ratio} -> ${item.water}g
                </div>
                <div class="delete-x" onclick="deleteItem(${item.id})">✕</div>
            `;
            els.savedList.appendChild(div);
        });
    }

    // Start
    init();

</script>
</body>
</html>
